[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "silver-age-middle-server"
version = "0.1.0"
description = "Silver Age Assistant family coordination API"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "tzdata>=2025.2,<2027",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "asgi-lifespan>=2.1,<3",
    "httpx>=0.28,<1",
    "mypy>=1.16,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12,<1",
    "types-pyjwt>=1.7,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]
