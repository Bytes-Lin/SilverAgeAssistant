只修改 MiddleServer/ 与必要文档。使用 SQLAlchemy 2 异步访问 SQLite，轻量阶段不引入 PostgreSQL 和 Redis。按单进程服务设计，可靠业务记录写入 SQLite，WebSocket 连接和可丢失的短期在线状态保存在进程内存。FastAPI 不代理 LLM/ASR/TTS。实现 REST 持久化、WebSocket 在线传输、ACK、断线重放、幂等和权限校验。路由保持薄，业务逻辑进入 service，持久化进入 repository。每个接口添加测试。不得声称 WebSocket 能在 Android 进程被杀后可靠送达。
"""
